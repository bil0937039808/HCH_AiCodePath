version: "3.9"

services:
  postgres:
    build:
      context: ./database/postgres
      dockerfile: Dockerfile_PostGresDB
    container_name: Postgres16
    # image: postgres:16.3-alpine
    restart: unless-stopped
    env_file:
      - ./database/config/postgres_conf.env
    volumes:
      # 資料持久化
      - ./database/postgres/pg_data:/var/lib/postgresql/data
      # 初始化 SQL 與 Shell 腳本
      - ./database/postgres/init_script:/docker-entrypoint-initdb.d
      # CSV 資料掛載到容器
      - ./database/postgres/init_csv:/data
    expose:
      - "5432"
    # ports:
    #   - "15432:5432"
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD-SHELL", "test -f /var/lib/postgresql/data/.init_done" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    container_name: redis7
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "admin", "--bind", "0.0.0.0", "--protected-mode", "no" ]
    env_file:
      - ./database/config/redis_conf.env
    volumes:
      - ./database/redis/redis_data:/data
      - ./database/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    expose:
      - "6379"
    # ports:
    #   - "6379:6379"
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "admin", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # milvus:
      #   condition: service_healthy
      # mongodb:
      #   condition: service_healthy
    # ports:
    #   - "9100:9100"
    expose:
      - "9100"
    volumes:
      - ./backend:/home/workspace
      - ./database/milvus_data:/home/workspace/init
      - ./backend/config:/home/workspace/config
    env_file:
      - ./database/config/postgres_conf.env
      - ./backend/config/backend_conf.env
    networks:
      - backend_network
      - roadmap_network
    command: >
      sh -c "echo '✅ 已就緒，正在啟動後端應用程式...' && python main_back.py"

  frontend:
    image: nginx
    container_name: frontend_web
    depends_on:
      - "backend"
    # ports:
    #   - "80:80"
    ports:
      - "80:80"           # ✅ 唯一對外暴露
      - "443:443"         # (可選) SSL
    volumes:
      - ./frontend/web:/usr/share/nginx/web
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend_network
    command: >
      sh -c "echo '✅ 後端服務已連接，正在啟動 Nginx 前端...' && nginx -g 'daemon off;'"

  login-service:
    build: ./login-service
    container_name: login_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=Postgres16
    env_file:
      - ./database/config/postgres_conf.env # 共用 Postgres 的設定
      - ./login-service/.env # 讀取 Flask 和 Google 的金鑰
    ports:
      - "5000:5000"
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
  roadmap_network:
    external: true

volumes:
  pg_data: # mongo_data:

  # mongo_config:
  redis_data:
