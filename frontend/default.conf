server {
    listen 80;
    server_name _;
    # server_name localhost;
    # server_name AICodePath;

    location = /index.html {
        root /usr/share/nginx/web;
        try_files $uri =404;
    }

    # 1. 將根目錄 `/` 指向主應用程式
    location / {
        root /usr/share/nginx/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 為登入相關的路徑建立專門的轉發規則
    location ~ ^/(login|register|logout|history|google-login-logic) {
        proxy_pass http://login_service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. 將 login-service 的靜態檔案請求也轉發過去
    location /static/ {
        proxy_pass http://login_service:5000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/status {
        proxy_pass http://login_service:5000/api/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:9100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  
    }

    location /ws/ {
        proxy_pass http://backend:9100; # <--- 修改此行，移除路徑
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }
}