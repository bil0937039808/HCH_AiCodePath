<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能分析 Dashboard | AI Code Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-slate-50">

  <header class="bg-teal-600 shadow-md">
    <div class="mx-auto flex h-16 max-w-screen-xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a class="flex items-center gap-2" href="./index.html">
        <i class="fa-solid fa-robot text-white text-xl"></i>
        <span class="text-white text-lg font-bold">AI Code Path</span>
      </a>

      <div id="user-status-container" class="flex items-center gap-2">
        <a href="/login"
          class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入 / 註冊</span>
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-screen-xl px-4 py-8 sm:px-6 lg:px-8">
    <section class="flex h-[65vh] flex-col overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3">
        <h2 id="dashTitle" class="text-lg font-bold text-gray-800">載入中…</h2>
        <span class="rounded-full bg-teal-100 px-3 py-1 text-xs font-medium text-teal-700">Dashboard</span>
      </div>
      <div id="dashBody" class="flex-1 bg-gray-50"></div>
    </section>

    <section class="sticky bottom-4 mt-6">
      <form id="dockForm" class="flex gap-2 rounded-lg border border-gray-300 bg-white p-4 shadow-lg">
        <input id="dockInput" type="text" class="w-full rounded-md border-gray-200 p-2 text-sm shadow-sm"
          placeholder="輸入條件，例如：每週 5 小時、預算 5000…">
        <button type="submit"
          class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg bg-teal-600 px-5 py-3 text-white transition hover:bg-teal-700 focus:outline-none focus:ring disabled:cursor-not-allowed disabled:bg-gray-400">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span class="text-sm font-medium">開始排課</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    // ... (此頁面原有的 script 邏輯維持不變)
  </script>
  <script type="module" src="mode.js"></script>
  <script type="module" src="./wizard.js"></script>

  <script>
    async function updateUserStatus() {
      const userStatusContainer = document.getElementById('user-status-container');
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          console.error('無法獲取登入狀態:', response.status);
          return;
        }
        const userData = await response.json();
        if (userData.logged_in && userData.username) {
          userStatusContainer.innerHTML = `
                      <a href="/history" class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
                          <i class="fa-solid fa-clock-rotate-left"></i>
                          <span>檢視歷史紀錄</span>
                      </a>
                      <span class="flex items-center gap-2 rounded-md bg-white/20 px-4 py-2 text-sm font-bold text-white">
                          <i class="fa-solid fa-user-circle"></i>
                          <span>${userData.username}</span>
                      </span>
                      <a href="/logout" class="flex items-center gap-2 rounded-md bg-red-500/80 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-500">
                          <i class="fa-solid fa-right-from-bracket"></i>
                          <span>登出</span>
                      </a>
                  `;
        }
      } catch (error) {
        console.error('更新使用者狀態時發生錯誤:', error);
      }
    }
    document.addEventListener('DOMContentLoaded', updateUserStatus);
  </script>
</body>

</html>
