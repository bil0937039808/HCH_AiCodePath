<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>對話式推薦 | AI Code Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-slate-50">

  <header class="bg-teal-600 shadow-md">
    <div class="mx-auto flex h-16 max-w-screen-xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a class="flex items-center gap-2" href="./index.html">
        <i class="fa-solid fa-robot text-white text-xl"></i>
        <span class="text-white text-lg font-bold">AI Code Path</span>
      </a>

      <div id="user-status-container" class="flex items-center gap-2">
        <a href="/login"
          class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入 / 註冊</span>
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-screen-xl px-4 py-8 sm:px-6 lg:px-8">
    <section class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="flex items-center gap-2 border-b border-gray-200 p-4">
        <i class="fa-solid fa-robot text-teal-600"></i>
        <p class="text-sm font-bold text-gray-800">說出你的理想工作條件</p>
      </div>

      <div id="quickchips" class="flex flex-wrap gap-2 border-b border-gray-200 bg-white p-4">
        <span
          class="cursor-pointer rounded-full bg-teal-100 px-3 py-1 text-xs font-medium text-teal-800 transition hover:bg-teal-200"
          data-insert="台北">台北</span>
        <span
          class="cursor-pointer rounded-full bg-teal-100 px-3 py-1 text-xs font-medium text-teal-800 transition hover:bg-teal-200"
          data-insert="遠端">遠端</span>
        <span
          class="cursor-pointer rounded-full bg-teal-100 px-3 py-1 text-xs font-medium text-teal-800 transition hover:bg-teal-200"
          data-insert="前端工程師">前端工程師</span>
        <span
          class="cursor-pointer rounded-full bg-teal-100 px-3 py-1 text-xs font-medium text-teal-800 transition hover:bg-teal-200"
          data-insert="資料工程師">資料工程師</span>
        <span
          class="cursor-pointer rounded-full bg-teal-100 px-3 py-1 text-xs font-medium text-teal-800 transition hover:bg-teal-200"
          data-insert="AI 工程師">AI 工程師</span>
        <span
          class="cursor-pointer rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-800 transition hover:bg-gray-200"
          data-insert="80k">月薪 80k</span>
      </div>

      <div id="chat" class="flex h-[60vh] flex-col gap-3 overflow-y-auto bg-gray-50 p-4">
        <div
          class="w-fit max-w-[85%] self-start rounded-lg rounded-bl-none border border-gray-200 bg-white p-3 text-sm text-gray-700">
          嗨！請描述你的目標職缺，或點擊上方標籤，完成後點擊「送出」將為您尋找相關職缺。
        </div>
      </div>

      <div class="flex items-center gap-2 border-t border-gray-200 p-4">
        <input id="chatInput" type="text" class="w-full rounded-md border-gray-200 p-2 text-sm shadow-sm"
          placeholder="輸入你的條件（地點 / 職稱 / 薪資）…">
        <button id="sendBtn"
          class="rounded-lg bg-teal-600 p-3 text-white transition hover:bg-teal-700 disabled:cursor-not-allowed disabled:bg-gray-400">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="./mode.js"></script>
  <script type="module" src="./chatbot.js"></script>

  <script>
    async function updateUserStatus() {
      const userStatusContainer = document.getElementById('user-status-container');
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          console.error('無法獲取登入狀態:', response.status);
          return;
        }
        const userData = await response.json();
        if (userData.logged_in && userData.username) {
          userStatusContainer.innerHTML = `
                      <a href="/history" class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
                          <i class="fa-solid fa-clock-rotate-left"></i>
                          <span>檢視歷史紀錄</span>
                      </a>
                      <span class="flex items-center gap-2 rounded-md bg-white/20 px-4 py-2 text-sm font-bold text-white">
                          <i class="fa-solid fa-user-circle"></i>
                          <span>${userData.username}</span>
                      </span>
                      <a href="/logout" class="flex items-center gap-2 rounded-md bg-red-500/80 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-500">
                          <i class="fa-solid fa-right-from-bracket"></i>
                          <span>登出</span>
                      </a>
                  `;
        }
      } catch (error) {
        console.error('更新使用者狀態時發生錯誤:', error);
      }
    }
    document.addEventListener('DOMContentLoaded', updateUserStatus);
  </script>
</body>

</html>
