<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>入口 | AI Code Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-slate-50">

  <header class="bg-teal-600 shadow-md">
    <div class="mx-auto flex h-16 max-w-screen-xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a class="flex items-center gap-2" href="./index.html">
        <i class="fa-solid fa-robot text-white text-xl"></i>
        <span class="text-white text-lg font-bold">AI Code Path</span>
      </a>

      <div id="user-status-container" class="flex items-center gap-2">
        <a href="/login"
          class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入 / 註冊</span>
        </a>
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-screen-xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8 lg:py-16">
    <div class="text-center">
      <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl">
        你想從哪裡開始？
      </h1>
      <p class="mt-4 max-w-2xl mx-auto text-lg text-gray-600">
        快速進入你需要的功能：按類別分析、或用 AI 對話拿推薦。
      </p>
    </div>

    <main class="mt-12">
      <div class="mx-auto grid max-w-4xl grid-cols-1 gap-8 md:grid-cols-2"
        style="display: flex; justify-content: center; align-items: center;">

        <a class="block rounded-xl border border-gray-200 p-8 shadow-sm transition hover:border-teal-500/10 hover:shadow-teal-500/10"
          href="./categories.html">
          <span class="inline-block rounded-lg bg-teal-600 p-3 text-white">
            <i class="fa-solid fa-layer-group fa-fw"></i>
          </span>
          <h2 class="mt-4 text-xl font-bold text-gray-900">職缺類別分析</h2>
          <p class="mt-1 text-base text-gray-600">
            直接選擇想前往的職涯類別（AI/資料/前端…）。可查看薪資分析並帶入排課。
          </p>
        </a>

        <a class="block rounded-xl border border-gray-200 p-8 shadow-sm transition hover:border-teal-500/10 hover:shadow-teal-500/10"
          href="./chatbot.html">
          <span class="inline-block rounded-lg bg-teal-600 p-3 text-white">
            <i class="fa-solid fa-comments fa-fw"></i>
          </span>
          <h2 class="mt-4 text-xl font-bold text-gray-900">對話式推薦</h2>
          <p class="mt-1 text-base text-gray-600">
            說出你的需求：工作內容、薪資、地點等，AI 即時回你合適職缺與學習規劃。
          </p>
        </a>

      </div>
    </main>

    <footer class="mt-12 text-center text-sm text-gray-500">
      © 2025 AI Code Path • Made for your learning roadmap
    </footer>
  </div>
  <script type="module" src="mode.js"></script>
  <script type="module" src="main.js" defer></script>

  <script>
    async function updateUserStatus() {
      const userStatusContainer = document.getElementById('user-status-container');
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          console.error('無法獲取登入狀態:', response.status);
          return;
        }
        const userData = await response.json();
        if (userData.logged_in && userData.username) {
          userStatusContainer.innerHTML = `
                      <a href="/history" class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
                          <i class="fa-solid fa-clock-rotate-left"></i>
                          <span>檢視歷史紀錄</span>
                      </a>
                      <span class="flex items-center gap-2 rounded-md bg-white/20 px-4 py-2 text-sm font-bold text-white">
                          <i class="fa-solid fa-user-circle"></i>
                          <span>${userData.username}</span>
                      </span>
                      <a href="/logout" class="flex items-center gap-2 rounded-md bg-red-500/80 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-500">
                          <i class="fa-solid fa-right-from-bracket"></i>
                          <span>登出</span>
                      </a>
                  `;
        }
      } catch (error) {
        console.error('更新使用者狀態時發生錯誤:', error);
      }
    }
    document.addEventListener('DOMContentLoaded', updateUserStatus);
  </script>
</body>

</html>
