<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>職缺結果 | AI Code Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-slate-50">

  <header class="bg-teal-600 shadow-md">
    <div class="mx-auto flex h-16 max-w-screen-xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a class="flex items-center gap-2" href="./index.html">
        <i class="fa-solid fa-robot text-white text-xl"></i>
        <span class="text-white text-lg font-bold">AI Code Path</span>
      </a>

      <div id="user-status-container" class="flex items-center gap-2">
        <a href="/login"
          class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入 / 註冊</span>
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-screen-xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="mb-6 flex items-center justify-between gap-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <p id="resultsSummary" class="text-sm text-gray-700 font-medium sm:block">
        載入中…
      </p>
      <button id="schedule-result-btn"
        class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-teal-600 px-5 py-3 text-white transition hover:bg-teal-700 focus:outline-none focus:ring disabled:cursor-not-allowed disabled:bg-gray-400 sm:w-auto">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span class="text-sm font-medium">排課結果</span>
      </button>
    </div>

    <div id="jobCardsContainer" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
    <div id="pagination-container" class="mt-8 flex justify-center"></div>
  </main>

  <script type="module" src="mode.js"></script>
  <script type="module" src="./jobs_data_with_skills.js" defer></script>
  <script type="module" src="./main.js" defer></script>
  <script type="module" src="./wizard.js" defer></script>

  <script>
    async function updateUserStatus() {
      const userStatusContainer = document.getElementById('user-status-container');
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          console.error('無法獲取登入狀態:', response.status);
          return;
        }
        const userData = await response.json();
        if (userData.logged_in && userData.username) {
          userStatusContainer.innerHTML = `
                      <a href="/history" class="flex items-center gap-2 rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/20">
                          <i class="fa-solid fa-clock-rotate-left"></i>
                          <span>檢視歷史紀錄</span>
                      </a>
                      <span class="flex items-center gap-2 rounded-md bg-white/20 px-4 py-2 text-sm font-bold text-white">
                          <i class="fa-solid fa-user-circle"></i>
                          <span>${userData.username}</span>
                      </span>
                      <a href="/logout" class="flex items-center gap-2 rounded-md bg-red-500/80 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-500">
                          <i class="fa-solid fa-right-from-bracket"></i>
                          <span>登出</span>
                      </a>
                  `;
        }
      } catch (error) {
        console.error('更新使用者狀態時發生錯誤:', error);
      }
    }
    document.addEventListener('DOMContentLoaded', updateUserStatus);
  </script>
</body>

</html>
